name: Build and Release

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0 的标签时触发

jobs:
  release:
    runs-on: windows-latest # 如果需要打包 Windows 程序，建议使用 windows-latest

    permissions:
      contents: write # 授予写入 Release 的权限

    steps:
      # 1. 检出仓库代码
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # 2. 使用 Marketplace 上的 PyInstaller Action 自动打包
      - name: Run PyInstaller
        run:
          pip install -r requirements.txt
          pyinstaller main.spec

      # 3. 自动发布 Release 并上传打包好的 exe 文件
      - name: Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe