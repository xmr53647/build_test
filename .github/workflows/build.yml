name: Build and Release

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0 的标签时触发

jobs:
  release:
    runs-on: windows-latest # 如果需要打包 Windows 程序，建议使用 windows-latest

    permissions:
      contents: write # 授予写入 Release 的权限

    steps:
      # 1. 检出仓库代码
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      
      - name: Run PyInstaller
        run: |
          pip install -r requirements.txt
          pyinstaller main.spec

      - uses: actions/upload-artifact@v6
        with:
          name: build-bin-${{ runner.os }}
          path: dist/*
      - name: Download workflow artifact
        uses: dawidd6/action-download-artifact@v28
        with:
          name: build-bin-${{ runner.os }}
          path: opt
          skip_unpack: true
      - name: Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            opt/*